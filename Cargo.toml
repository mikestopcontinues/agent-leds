[package]
name = "agent-leds"
version = "0.6.1"
edition = "2024"
description = "Status lights for coding agents on a SidePulse Pro, replacing its own software"
repository = "https://github.com/mikestopcontinues/agent-leds"
homepage = "https://github.com/mikestopcontinues/agent-leds"
license = "MIT"
readme = "README.md"
keywords = ["sidepulse", "claude-code", "codex", "hooks", "macos"]
categories = ["command-line-utilities"]
# The workshop and the README's previews are not part of the package.
exclude = ["/prototype", "/.claude", "/.github", "/docs", "/dist-workspace.toml"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"
plist = "1.10.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shlex = "2.0.1"
tempfile = "3.27.0"
toml = "1.2.1"
toml_edit = "0.25.19"

# The profile dist builds releases with.
[profile.dist]
inherits = "release"
lto = "thin"
