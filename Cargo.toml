[package]
name = "leds"
version = "0.1.0"
edition = "2024"
description = "Shows a queue of agent sessions on a SidePulse Pro's eight lights"
license = "MIT"
readme = "README.md"
keywords = ["sidepulse", "claude-code", "codex", "hooks", "macos"]
categories = ["command-line-utilities"]
# The workshop is a page for tuning the settings and is not part of the package.
exclude = ["/prototype", "/.claude"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
toml_edit = "0.25.19"
